{% extends "base.html" %}

{% block content %}

<div class="container py-4">


<h2>
Chat with Carvion Admin
</h2>


<div class="card shadow-sm">

<div class="card-body"
style="height:400px; overflow-y:auto;">


{% for msg in messages %}


<div class="mb-3">


{% if msg.sender_id == current_user.id %}

<div class="text-end">

<span class="badge bg-primary">
You
</span>

<p>
{{ msg.message }}
</p>

</div>


{% else %}


<div>

<span class="badge bg-success">
Admin
</span>

<p>
{{ msg.message }}
</p>

</div>


{% endif %}


</div>


{% else %}


<p class="text-muted">
No messages yet.
</p>


{% endfor %}


</div>


<form method="POST">


<div class="card-footer">


<textarea
name="message"
class="form-control mb-2"
placeholder="Type your message..."
required></textarea>


<button class="btn btn-primary">

Send Message

</button>


</div>


</form>


</div>


</div>


{% endblock %}
