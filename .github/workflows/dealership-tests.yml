name: Dealership tests
on:
  pull_request:
    paths:
      - 'dealership_models.py'
      - 'routes/dealers.py'
      - 'templates/dealers/**'
      - 'tests/test_dealership_structure.py'
      - 'tests/test_dealership_integration.py'
      - '.github/workflows/dealership-tests.yml'
  workflow_dispatch:
jobs:
  dealership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Alembic revision history
        run: |
          find migrations/versions -maxdepth 1 -type f -name '*.py' -print
          grep -H -E '^revision:|^revision =|^down_revision:|^down_revision =' migrations/versions/*.py || true
      - run: pip install -r requirements.txt pytest
      - name: Validate single Alembic head and dealership dependency
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config('migrations/alembic.ini')
          cfg.set_main_option('script_location', 'migrations')
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          print('Migration heads:', heads)
          assert heads == ['d41e20261109'], f'Unexpected migration heads: {heads}'
          assert script.get_revision('d41e20261109').down_revision == '00cfddfc8924'
          PY
      - run: python -m pytest -q tests/test_dealership_structure.py tests/test_dealership_integration.py
