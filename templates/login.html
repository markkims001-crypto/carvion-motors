{% extends "base.html" %}


{% block title %}
Login
{% endblock %}



{% block content %}


<div class="container py-5">


<div class="form-box">


<h2>
Login
</h2>



<form method="POST">



<input
type="email"
name="email"
placeholder="Email Address"
required>



<input
type="password"
name="password"
placeholder="Password"
required>



<button class="btn btn-primary w-100">

Login

</button>



</form>



<p class="mt-3">

Don't have an account?

<a href="/register">

Register

</a>

</p>


</div>


</div>


{% endblock %}
