```html
{% extends "base.html" %}

{% block title %}Login | Carvion Motors{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="form-box mx-auto" style="max-width: 450px;">

        <h2 class="mb-4">Login</h2>

        <form method="POST">

            <div class="mb-3">
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="text-end mb-3">
                <a href="{{ url_for('auth.forgot_password') }}">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>

        </form>

        <p class="mt-3">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Register</a>
        </p>

    </div>
</div>

{% endblock %}
```
