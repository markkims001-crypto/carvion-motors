{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container py-5">

```
<div class="form-box">

    <h2 class="mb-3">
        Forgot Password?
    </h2>

    <p class="text-muted mb-4">
        Enter your email address and we'll send you a link to reset your password.
    </p>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Send Reset Link
        </button>

    </form>

    <p class="mt-3">
        Remember your password?
        <a href="{{ url_for('auth.login') }}">
            Login
        </a>
    </p>

</div>
```

</div>

{% endblock %}
