{% extends "base.html" %}

{% block title %}
Register | Carvion Motors
{% endblock %}

{% block content %}

<div class="container py-5">

```
<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="form-box">

            <h2 class="text-center mb-4">
                Create Account
            </h2>

            <p class="text-center text-muted mb-4">
                Join Carvion Motors
            </p>

            <form method="POST">

                <!-- Full Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Full Name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Email Address"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        class="form-control"
                        placeholder="Phone Number"
                        required
                    >

                </div>


                <!-- Account Type -->
                <div class="mb-3">

                    <label class="form-label">
                        Account Type
                    </label>

                    <select
                        name="role"
                        class="form-select"
                        required
                    >

                        <option value="buyer" selected>
                            Buyer — I want to buy cars
                        </option>

                        <option value="seller">
                            Seller / Dealer — I want to sell cars
                        </option>

                    </select>

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create Password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Register -->
                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >

                    Create Account

                </button>

            </form>


            <p class="mt-4 text-center">

                Already have an account?

                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
