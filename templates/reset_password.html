{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3 class="mb-0">
                        Reset Password
                    </h3>

                </div>

                <div class="card-body">

                    <p class="text-muted text-center mb-4">
                        Enter your new password below.
                    </p>

                    <form
                        method="POST"
                        action="{{ url_for('auth.reset_password', token=token) }}"
                    >

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                New Password

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                minlength="6"
                                required
                            >

                            <small class="text-muted">
                                Minimum 6 characters.
                            </small>

                        </div>

                        <div class="mb-3">

                            <label
                                for="confirm_password"
                                class="form-label">

                                Confirm New Password

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                minlength="6"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Reset Password

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
