```html
{% extends "base.html" %}


{% block content %}



<div class="card shadow-sm p-4">


<h1 class="text-center mb-4">

Edit Vehicle

</h1>




<form method="POST"

enctype="multipart/form-data">





<div class="row g-3">



<div class="col-md-6">

<label>
Brand
</label>


<input
class="form-control"
type="text"
name="brand"
value="{{ car.brand }}"
required>


</div>




<div class="col-md-6">

<label>
Model
</label>


<input
class="form-control"
type="text"
name="model"
value="{{ car.model }}"
required>


</div>




<div class="col-md-4">

<label>
Year
</label>


<input
class="form-control"
type="number"
name="year"
value="{{ car.year }}"
required>


</div>




<div class="col-md-4">

<label>
Price (KSh)
</label>


<input
class="form-control"
type="number"
name="price"
value="{{ car.price }}"
required>


</div>




<div class="col-md-4">

<label>
Mileage
</label>


<input
class="form-control"
type="number"
name="mileage"
value="{{ car.mileage }}"
required>


</div>


</div>






<label class="mt-3">
Fuel
</label>


<select class="form-control"
name="fuel">


<option>
{{ car.fuel }}
</option>


<option>Petrol</option>

<option>Diesel</option>

<option>Hybrid</option>

<option>Electric</option>


</select>






<label class="mt-3">
Transmission
</label>


<select class="form-control"
name="transmission">


<option>
{{ car.transmission }}
</option>


<option>Automatic</option>

<option>Manual</option>


</select>







<label class="mt-3">
Engine
</label>


<input
class="form-control"
name="engine"
value="{{ car.engine or '' }}">






<label class="mt-3">
Color
</label>


<input
class="form-control"
name="color"
value="{{ car.color or '' }}">






<label class="mt-3">
Condition
</label>


<select class="form-control"
name="condition">


<option>
{{ car.condition }}
</option>


<option>New</option>

<option>Used</option>

<option>Foreign Used</option>


</select>







<label class="mt-3">
Location
</label>


<input
class="form-control"
name="location"
value="{{ car.location }}"
required>






<label class="mt-3">
Description
</label>


<textarea
class="form-control"
name="description">{{ car.description or '' }}</textarea>





<hr>


<h3>
Vehicle Images
</h3>


<p class="text-muted">
Upload a new image only if you want to replace an existing one.
</p>




<div class="row g-3">



{% for image in car.images %}



<div class="col-md-4">


<div class="card p-3">


<img

src="{{ url_for(
'static',
filename=image.filename
)}}"

class="img-fluid rounded mb-2"

height="180">





<label>

Replace Image

</label>



<input

class="form-control"

type="file"

name="image{{ loop.index }}"

accept="image/*">





</div>


</div>



{% endfor %}



</div>






<br>



<button class="btn btn-success w-100"

type="submit">


Update Vehicle


</button>




</form>





<a class="btn btn-secondary mt-3"

href="{{ url_for(
'cars.seller_dashboard'
)}}">


← Back to Dashboard


</a>




</div>




{% endblock %}
```
