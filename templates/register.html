{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="container py-5">

<div class="form-box">


<h2>
Create Account
</h2>


<form method="POST">


<input 
type="text"
name="name"
placeholder="Full Name"
required>


<input
type="email"
name="email"
placeholder="Email Address"
required>



<input
type="text"
name="phone"
placeholder="Phone Number"
required>



<input
type="password"
name="password"
placeholder="Password"
required>



<button class="btn btn-primary w-100">

Register

</button>


</form>


<p class="mt-3">

Already have an account?

<a href="/login">

Login

</a>

</p>


</div>

</div>

{% endblock %}
