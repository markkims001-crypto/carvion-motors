{% extends "base.html" %}
{% block title %}Reset by SMS | Carvion Motors{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 460px;">
    <div class="card-body p-4">
      <h2 class="mb-3">Reset using SMS</h2>
      <p class="text-muted">Enter the phone number linked to your account. If SMS delivery is available, we'll send a six-digit code.</p>
      <form method="POST" action="{{ url_for('auth.forgot_password_sms') }}">
        <input class="form-control mb-3" type="tel" name="phone" autocomplete="tel" placeholder="e.g. 0712345678" required>
        <button class="btn btn-primary w-100" type="submit">Send reset code</button>
      </form>
      <p class="text-center mt-3"><a href="{{ url_for('auth.forgot_password') }}">Use email instead</a></p>
      <p class="text-center"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
    </div>
  </div>
</div>
{% endblock %}
