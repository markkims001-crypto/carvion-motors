{% extends "base.html" %}

{% block title %}Login | Carvion Motors{% endblock %}

{% block content %}
<section class="page-auth">
    <div class="auth-card">
        <div class="auth-heading">
            <div class="auth-brand-mark" aria-hidden="true">C</div>
            <h1 class="h2 mb-2">Welcome back</h1>
            <p>Sign in to continue to Carvion Motors.</p>
        </div>

        <form method="POST" class="d-grid gap-3">
            <div>
                <label for="loginEmail" class="form-label">Email address</label>
                <input id="loginEmail" type="email" name="email" class="form-control"
                       placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div>
                <label for="loginPassword" class="form-label">Password</label>
                <input id="loginPassword" type="password" name="password" class="form-control"
                       placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <div class="text-end">
                <a href="{{ url_for('auth.forgot_password') }}" class="fw-semibold">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted">New to Carvion Motors?</span>
            <a href="{{ url_for('auth.register') }}" class="fw-bold ms-1">Create an account</a>
        </div>
    </div>
</section>
{% endblock %}
